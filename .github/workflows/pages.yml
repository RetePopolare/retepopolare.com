# Pubblica il sito su GitHub Pages a ogni modifica del ramo main.
name: Pubblica il sito

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file
        uses: actions/checkout@v4
      - name: Prepara Pages
        uses: actions/configure-pages@v5
      - name: Impacchetta il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
